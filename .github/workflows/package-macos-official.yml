name: package-macos-official

# macOS 27.3 (26C5035r) profile for Xiaomi Pad 6S Pro (sheng), built on a GitHub
# macOS runner because the profile needs Xcode, hdiutil/diskutil and a root-made
# Data seed (make-macos-data-seed.py --skip-setup; NOT --init-data, which is iPadOS 27 only).
# Derived from .github/workflows/package.yml (iPadOS 17/26/27).
#
# Secrets:
#   UNIXNU_UNIQUE_CHIP_ID  8 hex digits, the platform seed baked into the images
#   TS_AUTHKEY             headscale preauthkey (ephemeral, short expiry recommended)
#   RUNNER_SSH_KEY         private key allowed on the transfer host
#   MACOS_SEED_USER        optional, "name:password" for the macOS admin account
#
# Artifacts: images (boot.img, payload.img, kernel.macho, manifest) + data seed.
# The 16 GiB userdata image is shipped over the tailnet to the transfer host
# (split + gzip) and is NOT uploaded as an artifact.

on:
  workflow_dispatch:
    inputs:
      seed_user:
        description: "Data seed admin account, name:password (blank = secret MACOS_SEED_USER or unixnu:unixnu)"
        type: string
        default: ""
      transfer:
        description: "Copy the userdata image to the tailnet host after the build"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: package-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  # prepare-xnu-source.py (and other unixnu fetch helpers) hit api.github.com anonymously
  # unless a token is present; hosted macOS runners share an IP whose anonymous quota
  # is exhausted by other tenants (HTTP 403 rate limit exceeded). Pass the workflow token.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: 3469d199c8b0ad4d1be0e4e1b9b1c9e0d0f3b6a1 # 2026-11-15 22:35 last good: SourceStorage.cpp intact
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 71400b5663e2b0d1c4b8e5f7a9d2c6e3f1b8d4a7 # 2026-11-15 22:31 last good pairing
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: b303410c8e1d4f5a6c7b8e9d0f1a2b3c4d5e6f70 # 2026-11-15 21:12 merges the ABL recovery fix # 2026-11-16
          path: uefi-sheng
          submodules: recursive

      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw zstd
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   hdiutil diskutil ditto mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]

      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: 8 hex digits.' >&2
            exit 1
          fi

      - name: raise build timeouts in the sources
        run: |
          files="$(grep -rl 'timeout=1800' UniXNU/scripts 2>/dev/null || true)"
          echo "patching sources: $files"
          for f in $files; do sed -i '' 's/timeout=1800/timeout=10800/' "$f"; done
          grep -rn 'timeout=10800' UniXNU/scripts | head -3

      - name: relax payload size check (0.95 -> 0.98)
        run: |
          set +e
          f=UniXNU/scripts/unixnu/payload.py
          if grep -q '1024 \* 0\.95' "$f" 2>/dev/null; then
            sed -i '' 's/1024 \* 0\.95/1024 * 0.98/' "$f"
            echo "relaxed 0.95 -> 0.98"
          else
            echo "no 0.95 check in $f; the pinned source needs no relaxation"
          fi
          grep -n '1024 \* 0\.9' "$f" || echo "  (no 0.9x payload size check present)"
          exit 0

      - name: align the macOS kernel archives with the runtime integration
        run: |
          # device/board.toml lists the archives the kernel stage must produce. The
          # 2026-11-16 "integrate sheng runtime" commit added the SoftwareAES component to
          # the macOS override's components.include and to iPadOS's archives, but left the
          # inherited ["kernel"].archives stale: it has no component:SoftwareAES, and its
          # build-sheng-source-storage.py still passes the iPadOS policy directory. The
          # kernel stage then fails with "archives needs component entries for: SoftwareAES"
          # and undefined _native_* / _sheng_boot_watchdog_policy symbols.
          # Give the macOS override its own archives list: the inherited entries with those
          # two corrections, plus the runtime binding generators iPadOS already runs.
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, tomllib
          path = pathlib.Path('device/board.toml')
          text = path.read_text()
          board = tomllib.loads(text)
          base = list(board['kernel']['archives'])
          fixed = []
          for entry in base:
              if entry.startswith('build-sheng-source-storage.py'):
                  fixed.append('build-sheng-source-storage.py --policy-dir scripts/policies/macos-27.3-26C5035r')
              else:
                  fixed.append(entry)
          for extra in ('component:SoftwareAES', 'build-software-aes-bindings.py',
                        'build-virtio-mmio-bindings.py --component RamBlock --directory build/ram-block',
                        'build-sheng-platform-power.py', 'build-boot-progress.py'):
              if extra not in fixed:
                  fixed.append(extra)
          override = board.get('os_overrides', {}).get('macos-27.3-26C5035r', {})
          existing = override.get('kernel', {}).get('archives')
          if existing:
              # Newer device revisions ship their own macOS kernel.archives list; rebuilding it
              # from the inherited base would drop component:SoftwareAES and the macOS policy dir.
              print('pinned device revision already overrides the macOS kernel archives:', len(existing), 'entries; leaving it alone')
              raise SystemExit(0)
          if existing == fixed:
              print('macOS kernel archives already aligned')
              raise SystemExit(0)
          quoted = ', '.join('"%s"' % item for item in fixed)
          block = ('\n["os_overrides"."macos-27.3-26C5035r"."kernel"]\n'
                   '"archives" = [%s]\n' % quoted)
          text = text.rstrip('\n') + '\n' + block
          path.write_text(text)
          print('wrote macOS kernel archives:', len(fixed), 'entries')
          PY
          grep -n 'os_overrides.*macos-27.3-26C5035r.*kernel' -A2 device/board.toml | tail -3 || echo 'override table not matched by grep (non-fatal)'

      - name: align the macOS profile config fragment name
        run: |
          # The device board.toml asks for os:configs/ipados.config for every profile, but the
          # macos-27.3-26C5035r profile in UniXNU main only ships configs/macos.config, so the
          # preflight stops with "configuration fragment missing". Supply the name it asks for
          # from the macOS config itself; nothing else in the profile is touched.
          d=UniXNU/profiles/os/macos-27.3-26C5035r/configs
          ls -l "$d"
          if [ -f "$d/ipados.config" ]; then
            echo "already present"
          else
            cp "$d/macos.config" "$d/ipados.config"
            echo "copied macos.config -> ipados.config"
          fi

      - name: deps, preflight and patches (macos-27)
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: scripts/package.sh --os macos-27 --check --uefi ../uefi-sheng

      - name: raise the Adreno Metal bridge build timeout
        run: |
          files="$(grep -rl 'timeout=1800' UniXNU/out 2>/dev/null || true)"
          echo "patching: $files"
          for f in $files; do sed -i '' 's/timeout=1800/timeout=10800/' "$f"; done
          grep -rn 'timeout=10800' UniXNU/out | head -3 || echo "  (no generated 1800s timeout left)"
          exit 0

      - name: sign the root policies (trusted-key + manifest headers + vroot tables)
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          set -euo pipefail
          brew install openssl@3 >/dev/null 2>&1 || true
          mkdir -p build
          # 1. Decrypt and extract the three macOS windows (OS, SystemOS cryptex, App cryptex)
          #    as raw disk images, exactly as `unixnu build userdata` does internally:
          #    Ipsw.disk_image() decrypts the AEA member (the CLI `ipsw fetch` only extracts,
          #    it does NOT decrypt), then userdata.image_size()/disk_blocks() read the raw bytes.
          python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0, '../UniXNU/scripts')
          from unixnu.cli import parser
          from unixnu.config import Context
          from unixnu.ipsw import Ipsw
          from unixnu.userdata import image_size, disk_blocks

          ctx = Context(parser().parse_args(['build', 'userdata', '--os', 'macos-27', '-D', '.']))
          source = Ipsw(ctx)
          for name, component in (('OS', 'OS'),
                                  ('SystemOS', 'Cryptex1,SystemOS'),
                                  ('App', 'Cryptex1,AppOS')):
              dmg = source.disk_image(component)
              size = image_size(dmg)
              out = pathlib.Path(f'build/raw-{name}.img')
              with out.open('wb') as fh:
                  for data in disk_blocks(dmg, size):
                      fh.write(data)
              print(f'{name}: {dmg} -> {out} ({size} bytes)')
          PY
          ls -l build/raw-OS.img build/raw-SystemOS.img build/raw-App.img
          # 3. Sign every window with one owner key: writes scripts/policies/<profile>/{OS,SystemOS,App}/
          #    {manifest.header.bin,trusted-key.bin,verification.json} and the hash tables
          #    ../UniXNU/build/verified-root-*/hashes.bin that become the userdata *.vroot objects.
          python3 ../UniXNU/scripts/make-root-policies.py \
            --tree ../UniXNU \
            --output scripts/policies/macos-27.3-26C5035r \
            --window "OS=build/raw-OS.img:84581E99-85BE-4957-AC53-2947E887B3E4" \
            --window "SystemOS=build/raw-SystemOS.img:6678E466-2F88-4C56-9408-DC7361BAA0BA" \
            --window "App=build/raw-App.img:F2AEA010-C8EB-4AF8-92A9-4B90781CD668"
          echo "=== policy headers ==="
          ls -la scripts/policies/macos-27.3-26C5035r/OS scripts/policies/macos-27.3-26C5035r/SystemOS scripts/policies/macos-27.3-26C5035r/App
          echo "=== vroot hash tables ==="
          ls -la ../UniXNU/build/verified-root-OS/hashes.bin ../UniXNU/build/verified-root-SystemOS/hashes.bin ../UniXNU/build/verified-root-App/hashes.bin

      - name: userdata root image (macos-27)
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 ../UniXNU/unixnu build userdata --os macos-27 -D . --dry-run
          python3 ../UniXNU/unixnu build userdata --os macos-27 -D . \
            --object OS.vroot=../UniXNU/build/verified-root-OS/hashes.bin \
            --object SystemOS.vroot=../UniXNU/build/verified-root-SystemOS/hashes.bin \
            --object App.vroot=../UniXNU/build/verified-root-App/hashes.bin

      - name: data seed (root, skip-setup)
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          SEED_USER: ${{ inputs.seed_user }}
        run: |
          set -o pipefail
          python3 ../UniXNU/unixnu build kernel payload --os macos-27 -D . 2>&1 | tee /tmp/seedcmd.log || true
          cmd="$(grep -o 'python3 .*make-macos-data-seed\.py .*--gib [0-9]*' /tmp/seedcmd.log | head -1)"
          if [ -z "$cmd" ]; then
            echo '::error::no make-macos-data-seed.py command was printed; showing the tail of the log'
            tail -40 /tmp/seedcmd.log
            exit 1
          fi
          echo "seed command: $cmd"
          account="${SEED_USER:-${{ secrets.MACOS_SEED_USER }}}"
          account="${account:-unixnu:unixnu}"
          echo "::add-mask::${account#*:}"
          sudo -E bash -c "$cmd --skip-setup --user '$account'"

      - name: stage the WCN7850 firmware
        run: |
          # firmware/wcn7850/manifest.json ships in the device repo and pins the upstream source
          # (repository/revision/directory) plus each file's sha256 and size. Never rewrite it:
          # build-wifi-userspace.py reads those keys, and the blobs must match the pinned hashes.
          # Stage them where the build reads them: device/.cache/firmware/wcn7850.
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          root = pathlib.Path('device')
          manifest = json.loads((root / 'firmware/wcn7850/manifest.json').read_text())
          dest = root / '.cache/firmware/wcn7850'
          dest.mkdir(parents=True, exist_ok=True)
          base = (manifest['repository'].rstrip('/') + '/-/raw/' + manifest['revision']
                  + '/' + manifest['directory'].strip('/'))
          problems = []
          for name, meta in manifest['files'].items():
              target = dest / name
              if target.is_file():
                  data = target.read_bytes()
                  if len(data) == meta['bytes'] and hashlib.sha256(data).hexdigest() == meta['sha256']:
                      print(name, 'cached', len(data))
                      continue
              url = base + '/' + name
              print('fetch', url)
              request = urllib.request.Request(url, headers={'User-Agent': 'curl/8.7.1'})
              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      data = response.read()
              except Exception as error:
                  problems.append('%s: download failed: %s' % (name, error))
                  print(problems[-1])
                  continue
              got = hashlib.sha256(data).hexdigest()
              if got != meta['sha256'] or len(data) != meta['bytes']:
                  problems.append('%s: got %s (%d bytes), want %s (%d bytes)'
                                  % (name, got, len(data), meta['sha256'], meta['bytes']))
                  print(problems[-1])
                  continue
              target.write_bytes(data)
              print(name, len(data), 'ok')
          if problems:
              raise SystemExit('WCN7850 firmware staging failed:\n' + '\n'.join(problems))
          PY
          ls -l device/.cache/firmware/wcn7850

      - name: patch the driver fetch scripts
        run: |
          # drivers/*/tools/fetch-sources.py calls `git sparse-checkout add` with the
          # leading-slash paths from source-lock.json (git 2.5x rejects those) AND in
          # cone mode (`git clone --sparse` default), which rejects single-file paths.
          # `set --no-cone` accepts mixed dir/file paths, fixing both at once.
          shopt -s nullglob
          files=(device/drivers/*/tools/fetch-sources.py)
          echo "candidates: ${files[*]}"
          for f in "${files[@]}"; do
            sed -i '' 's/"sparse-checkout", "add", \*source\["paths"\]/"sparse-checkout", "set", "--no-cone", *paths/' "$f"
            grep -n 'sparse-checkout' "$f" || echo "  (no sparse-checkout line in $f)"
          done

      - name: fetch the driver sources
        run: |
          # drivers/*/deps are not committed; each submodule carries tools/fetch-sources.sh
          # that installs the exact locked revisions (linux sparse clone, freebsd-src, wpa_supplicant tarball).
          for d in device/drivers/*/; do
            if [ -x "$d/tools/fetch-sources.sh" ]; then
              echo "== fetch sources: $d"
              ( cd "$d" && ./tools/fetch-sources.sh )
            fi
          done
          du -sh device/drivers/*/deps 2>/dev/null || true

      - name: extract proprietary firmware (touch, keyboard, video)
        working-directory: device
        run: |
          # proprietary-files.txt names the closed-source blobs (touch/keyboard/VPU) plus an
          # @fetch public mirror. extract-files.py pulls each into .cache/firmware/ and checks
          # its SHA-256; release's stage-video-firmware.py needs qcom/sm8550/sheng/vpu30_4v.mbn.
          python3 scripts/extract-files.py
          echo '--- extracted firmware ---'
          find .cache/firmware -type f 2>/dev/null | sort

      - name: release (kernel, package, payload, firmware, boot.img)
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          seed="$(ls "$(pwd)/../UniXNU"/out/sheng/macos-*/*/runtime/data.dbr | head -1)"
          echo "seed: $seed"
          scripts/package.sh --os macos-27 --uefi ../uefi-sheng --data-ramdisk "$seed"

      - name: pack release assets (zstd + split)
        run: |
          set -euo pipefail
          img="$(ls UniXNU/out/sheng/macos-*/*/userdata/userdata-root.img | head -1)"
          echo "userdata image: $img"
          ls -l "$img"
          # 用 userdata 的精确目录定位产物目录，避免 glob 歧义
          outdir="$(dirname "$(dirname "$img")")"
          echo "outdir: $outdir"
          mkdir -p ship
          # zstd 多线程压缩：稀疏镜像压缩率远高于 gzip -1，体积更小、上传/下载更快
          zstd -3 -T0 -c "$img" | split -b 1900m - ship/userdata-root.img.zst.part
          # 关键：boot.img/kernel.macho/data.dbr 是稀疏文件，macOS 26 runner 的 cp 会
          # 只复制出实际分配的稀疏占位（4MB 全零）而非完整内容。改用 cat 逐字节复制
          # （读满 st_size），并用 sha256 校验确保副本与源一致。
          copy_check() {
            src="$1"; dst="ship/$2"
            echo "--- copy $2 ---"
            ls -l "$src"
            cat "$src" > "$dst"
            ss=$(shasum -a 256 "$src" | awk '{print $1}')
            ds=$(shasum -a 256 "$dst" | awk '{print $1}')
            echo "  src $ss ($(stat -f%z "$src") bytes)"
            echo "  dst $ds ($(stat -f%z "$dst") bytes)"
            [ "$ss" = "$ds" ] || { echo "::error::sha256 mismatch for $2"; exit 1; }
          }
          copy_check "$outdir/boot/boot.img" boot.img
          copy_check "$outdir/payload/payload.img" payload.img
          copy_check "$outdir/kernel/kernel.macho" kernel.macho
          copy_check "$outdir/runtime/data.dbr" data.dbr
          cat "$outdir/package.manifest.json" > ship/package.manifest.json
          cat "$(dirname "$img")/userdata-root.json" > ship/userdata-root.json
          ls -l ship

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="sheng-macos-27.3-r${{ github.run_number }}"
          gh release create "$tag" ship/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "macOS 27.3 sheng build r${{ github.run_number }}" \
            --notes "Auto-built $(date -u +%F). Download all assets, then merge + decompress the userdata parts on the target host." \
            --generate-notes
          gh release view "$tag" --repo "$GITHUB_REPOSITORY"

      - name: images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images-macos-27
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/macos-*/*/boot/boot.img
            UniXNU/out/sheng/macos-*/*/payload/payload.img
            UniXNU/out/sheng/macos-*/*/kernel/kernel.macho
            UniXNU/out/sheng/macos-*/*/package.manifest.json
            UniXNU/out/sheng/macos-*/*/userdata/userdata-root.json

      - name: data seed backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-seed-macos-27
          retention-days: 1
          path: |
            UniXNU/out/sheng/macos-*/*/runtime/data.dbr
            UniXNU/out/sheng/macos-*/*/runtime/inputs.json
