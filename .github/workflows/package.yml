name: package

# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 82b847c4ac3f68a57024b3082ffa3a03442defd9 # Wi-Fi runtime and Data firmware integration
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: mesa new-file patch header fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('UniXNU/patches/mesa')
          fixed = 0
          for p in sorted(root.glob('*.patch')):
              lines = p.read_text().splitlines(keepends=True)
              out, changed = [], False
              for i, line in enumerate(lines):
                  out.append(line)
                  if line.startswith('diff --git'):
                      j, hasmode = i + 1, False
                      while j < len(lines) and not lines[j].startswith('--- '):
                          if lines[j].startswith('new file mode'):
                              hasmode = True
                          j += 1
                      if j < len(lines) and lines[j].startswith('--- /dev/null') and not hasmode:
                          out.append('new file mode 100644\n')
                          changed = True
              if changed:
                  p.write_text(''.join(out))
                  fixed += 1
                  print('fixed new-file header:', p.name)
          print(f'{fixed} mesa patch(es) fixed (cold-build git apply dev/null workaround)')
          PY
      - name: ath12k locked wifi sources provision
        run: |
          python3 - <<'PY'
          # Cold-build CI has no local deps/ for Ath12kWifi (the author keeps them
          # local, like the WCN7850 firmware blobs); fetch-sources.py --check only
          # verifies and exits "missing source". Provision the exact locked sources
          # here; the upstream --check then validates revisions, required files and
          # SHA-256 unchanged. Fetch by locked commit (freebsd releng/15.1 is a
          # moving branch, cloning the ref lands on the wrong revision) with
          # non-cone sparse patterns (cone mode cannot express the single-file
          # paths in source-lock.json). Bounded retries with a mirror fallback.
          import hashlib, json, shutil, subprocess, sys, tarfile, urllib.request
          from pathlib import Path
          root = Path('device/drivers/Ath12kWifi')
          lock = json.loads((root / 'tools/source-lock.json').read_text())
          deps = root / 'deps'
          deps.mkdir(exist_ok=True)
          def run(*a):
              subprocess.run(list(a), check=True)
          for name in ('linux', 'freebsd'):
              s = lock[name]
              d = deps / name
              if d.exists():
                  print(f'{name}: already present')
                  continue
              urls = [s['url']]
              if 'git.kernel.org' in s['url']:
                  urls.append(s['url'].replace('git.kernel.org', 'kernel.googlesource.com'))
              ok = False
              for i in range(4):
                  url = urls[i % len(urls)]
                  try:
                      d.mkdir(parents=True)
                      run('git', 'init', '-q', str(d))
                      run('git', '-C', str(d), 'remote', 'add', 'origin', url)
                      run('git', '-C', str(d), 'sparse-checkout', 'set', '--no-cone', *s['paths'])
                      run('git', '-C', str(d), 'fetch', '--depth', '1', '--filter=blob:none', 'origin', s['commit'])
                      run('git', '-C', str(d), 'checkout', '-q', '--detach', s['commit'])
                      ok = True
                      break
                  except subprocess.CalledProcessError as e:
                      print(f'{name}: attempt {i+1} failed via {url}: {e}', flush=True)
                      shutil.rmtree(d, ignore_errors=True)
              if not ok:
                  sys.exit(f'{name}: could not fetch locked commit {s["commit"]}')
              rev = subprocess.check_output(['git', '-C', str(d), 'rev-parse', 'HEAD'], text=True).strip()
              if rev != s['commit']:
                  sys.exit(f'{name}: fetched {rev}, expected {s["commit"]}')
              print(f'{name}: locked commit {rev[:12]} fetched')
          s = lock['supplicant']
          arc = deps / s['archive']
          if not arc.exists():
              tmp = arc.with_suffix('.part')
              for i in range(4):
                  try:
                      with urllib.request.urlopen(s['url'], timeout=120) as r, tmp.open('wb') as o:
                          shutil.copyfileobj(r, o)
                      break
                  except Exception as e:
                      print(f'supplicant archive attempt {i+1}: {e}', flush=True)
                      if i == 3:
                          raise
              if hashlib.sha256(tmp.read_bytes()).hexdigest() != s['sha256']:
                  sys.exit('supplicant archive hash mismatch')
              tmp.replace(arc)
          d = deps / s['directory']
          if not d.exists():
              with tarfile.open(arc) as t:
                  for m in t.getmembers():
                      p = (deps / m.name).resolve()
                      if not (m.isfile() or m.isdir()) or d.resolve() not in (p, *p.parents):
                          sys.exit(f'unexpected archive member: {m.name}')
                  t.extractall(deps)
          print('ath12k locked sources provisioned; upstream --check will verify')
          PY
      - name: keyboard MCU firmware provision
        run: |
          python3 - <<'PY'
          # archive-19 (build-gop-legacy-display-27.py) embeds the keyboard cover's
          # Nanosic MCU RAM image and only reads device/.cache/firmware/nanosic/.
          # The author keeps that blob local (like WCN7850); firmware/nanosic/ in
          # this repository holds the exact image pinned by proprietary-files.txt
          # (@fetch mirror commit 2c1e2729, sha256 verified). Idempotent: an already
          # correct cache is left alone; the author's extract-files.py is the fallback.
          import hashlib, shutil, subprocess
          from pathlib import Path
          root = Path('device')
          name = 'nanosic/MCU_Upgrade.bin'
          pin = next(line.strip().split('|')[1]
                     for line in (root / 'proprietary-files.txt').read_text().splitlines()
                     if line.strip().startswith(name + '|'))
          dst = root / '.cache/firmware' / name
          if dst.is_file() and hashlib.sha256(dst.read_bytes()).hexdigest() == pin:
              print('keyboard firmware already cached')
          else:
              src = root / 'firmware' / name
              if src.is_file() and hashlib.sha256(src.read_bytes()).hexdigest() == pin:
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(src, dst)
                  print('keyboard firmware provisioned from repository copy')
              else:
                  subprocess.run(['python3', 'scripts/extract-files.py', '--section', 'Keyboard'],
                                 cwd=root, check=True)
          data = dst.read_bytes()
          if hashlib.sha256(data).hexdigest() != pin:
              raise SystemExit('keyboard firmware hash mismatch')
          print(f'keyboard firmware ready: {len(data)} bytes, sha256 verified')
          PY
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          scripts/package.sh "${args[@]}"
      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
